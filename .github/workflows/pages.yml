name: Pages

on:
  push:
    branches: [master]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "11 1,7,13,19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: rekurt/rekurt.github.io/.github/workflows/project-pages.yml@main
    with:
      slug: prt
