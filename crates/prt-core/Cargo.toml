[package]
name = "prt-core"
version.workspace = true
description = "Network port scanning library for macOS and Linux with connection tracking, proxy detection, alerts and JSON/CSV export"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prt-core"
keywords = ["network", "port", "scanner", "lsof", "procfs"]
categories = ["network-programming", "os"]
readme = "README.md"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
nix.workspace = true
uzers.workspace = true
sys-locale = "0.3"
toml.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scanner_bench"
harness = false
