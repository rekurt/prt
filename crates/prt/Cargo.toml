[package]
name = "prt"
version.workspace = true
description = "Live network port inspector for macOS and Linux with process details, SSH tunnel health, alerts and JSON/CSV export"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prt-core"
keywords = ["network", "port", "monitor", "tui", "terminal"]
categories = ["command-line-utilities", "network-programming"]
readme = "../../README.md"

[[bin]]
name = "prt"
path = "src/main.rs"

[dependencies]
prt-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
arboard.workspace = true
nix.workspace = true
ratatui = "0.29"
crossterm = "0.28"
